name: chord-demo

services:
  node0:
    build: ./node
    image: demo/chord-node
    container_name: chord_node_0
    command: python main.py
    environment:
      - CHORD_PORT=42000
      - API_PORT=43000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:43000/health')"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
      - 43000:43000
    volumes:
      - ./mounts/node0/logs:/app/logs
      - ./mounts/node0/files:/app/files

  node1:
    build: ./node
    image: demo/chord-node
    container_name: chord_node_1
    command: python main.py
    environment:
      - "JOIN_ADDR=node0:42000"
      - CHORD_PORT=42001
      - API_PORT=43001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:43001/health')"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
      - 43001:43001
    volumes:
      - ./mounts/node1/logs:/app/logs
      - ./mounts/node1/files:/app/files
    depends_on:
      node0:
        condition: service_healthy

